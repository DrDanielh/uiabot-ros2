slam_toolbox:
  ros__parameters:
    # Plugin params (optimized for Jetson)
    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSE_SCHUR  # Changed from SPARSE_NORMAL_CHOLESKY for memory
    ceres_preconditioner: SCHUR_JACOBI
    ceres_trust_strategy: LEVENBERG_MARQUARDT
    ceres_dogleg_type: TRADITIONAL_DOGLEG
    ceres_loss_function: None

    # ROS Parameters
    odom_frame: odom
    map_frame: map
    base_frame: base_link
    scan_topic: /scan
    mode: mapping
    transform_publish_period: 0.025  # Matches 10Hz lidar (1/10s)
    
    # Critical LIDAR Range Fixes (from your error logs)
    minimum_laser_range: 0.2       # RPLIDAR minimum (was 0.0)
    maximum_laser_range: 7.0      # RPLIDAR maximum (was 20.0)
    resolution: 0.05               # Recommended for indoor/outdoor

    # SLAM Behavior (tuned for 10Hz RPLIDAR)
    use_scan_matching: true
    use_scan_barycenter: false
    minimum_travel_distance: 0.15   # Increased from 0.05 for smoother mapping
    minimum_travel_heading: 0.02    # Increased from 0.05
    scan_buffer_size: 30           # Increased from 10 for 10Hz lidar
    scan_buffer_maximum_scan_distance: 7.0  # Matches lidar max
    minimum_score: 150

    # Matching Parameters (optimized for 12m range)
    link_match_minimum_response_fine: 0.1
    link_scan_maximum_distance: 1.5  # Increased from 1.5 (better for larger spaces)
    loop_search_maximum_distance: 4.0  # Increased from 3.0 (50% of max range)
    do_loop_closing: true          # Set false if CPU overloaded

    # Loop Closing (balanced for performance)
    loop_match_minimum_chain_size:   10
    loop_match_maximum_variance_coarse: 3.0
    loop_match_minimum_response_coarse: 0.5
    loop_match_minimum_response_fine: 0.6

    # Correlation Parameters
    correlation_search_space_dimension: 0.8  # Increased from 0.5
    correlation_search_space_resolution: 0.01
    correlation_search_space_smear_deviation: 0.1

    # Loop Closure Search
    loop_search_space_dimension: 8.0
    loop_search_space_resolution: 0.05
    loop_search_space_smear_deviation: 0.03

    # Scan Matcher (conservative values)
    distance_variance_penalty: 0.5
    angle_variance_penalty: 1.0
    fine_search_angle_offset: 0.00349
    coarse_search_angle_offset: 0.349
    coarse_angle_resolution: 0.0349
    minimum_angle_penalty: 0.9
    minimum_distance_penalty: 0.5
    use_response_expansion: false  # Disabled for performance
